<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Taxonomy of Disaggregated LLM Serving</title>
  <desc id="desc">A visual map of LLM serving foundations, PD disaggregation, AFD and DEP, KV cache systems, re-aggregation baselines, and open problems.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 48px; font-weight: 760; fill: #122033; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 22px; font-weight: 440; fill: #506070; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 26px; font-weight: 720; fill: #142033; }
      .section-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #536271; }
      .paper { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 650; fill: #1b2636; }
      .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 470; fill: #4e5f70; }
      .axis { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 520; fill: #475569; }
      .card { fill: #ffffff; stroke-width: 2; }
      .pill { stroke-width: 0; }
      .shadow { filter: drop-shadow(0 10px 18px rgba(15, 23, 42, 0.10)); }
      .line { fill: none; stroke: #9aa7b5; stroke-width: 2.2; stroke-linecap: round; }
      .dash { fill: none; stroke: #aab5c0; stroke-width: 2; stroke-dasharray: 8 8; stroke-linecap: round; }
    </style>
    <linearGradient id="pdGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e6fbf6"/>
      <stop offset="100%" stop-color="#d5f3ea"/>
    </linearGradient>
    <linearGradient id="afdGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#dce8ff"/>
    </linearGradient>
    <linearGradient id="kvGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7e6"/>
      <stop offset="100%" stop-color="#fdecc5"/>
    </linearGradient>
    <linearGradient id="aggGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe2e7"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f2f6f8"/>
      <stop offset="100%" stop-color="#e9eef2"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <text class="title" x="80" y="82">Disaggregated LLM Serving Map</text>
  <text class="subtitle" x="82" y="122">AFD, PD disaggregation, KV-cache systems, MoE serving substrates, and re-aggregation baselines</text>

  <rect x="76" y="155" width="1448" height="78" rx="16" fill="#122033"/>
  <text class="axis" x="116" y="187">Four axes</text>
  <text class="axis" x="116" y="214">what is split</text>
  <circle cx="302" cy="194" r="5" fill="#7dd3fc"/>
  <text class="axis" x="326" y="201">where it is split</text>
  <circle cx="542" cy="194" r="5" fill="#86efac"/>
  <text class="axis" x="566" y="201">how state moves</text>
  <circle cx="782" cy="194" r="5" fill="#facc15"/>
  <text class="axis" x="806" y="201">when placement adapts</text>
  <circle cx="1096" cy="194" r="5" fill="#fda4af"/>
  <text class="axis" x="1120" y="201">which baseline it must beat</text>

  <rect class="card shadow" x="76" y="286" width="230" height="394" rx="18" stroke="#cbd5e1" fill="url(#baseGrad)"/>
  <text class="section-title" x="104" y="330">Serving</text>
  <text class="section-title" x="104" y="362">Foundations</text>
  <text class="section-subtitle" x="104" y="394">co-located runtime layer</text>
  <rect class="pill" x="104" y="424" width="152" height="38" rx="10" fill="#e2e8f0"/>
  <text class="paper" x="124" y="449">Orca</text>
  <rect class="pill" x="104" y="478" width="152" height="38" rx="10" fill="#e2e8f0"/>
  <text class="paper" x="124" y="503">vLLM</text>
  <rect class="pill" x="104" y="532" width="152" height="38" rx="10" fill="#e2e8f0"/>
  <text class="paper" x="124" y="557">SGLang</text>
  <text class="note" x="104" y="610">Continuous batching,</text>
  <text class="note" x="104" y="632">PagedAttention, routing,</text>
  <text class="note" x="104" y="654">runtime primitives.</text>

  <rect class="card shadow" x="356" y="286" width="268" height="394" rx="18" stroke="#8dd6c4" fill="url(#pdGrad)"/>
  <text class="section-title" x="384" y="330">PD</text>
  <text class="section-title" x="384" y="362">Disaggregation</text>
  <text class="section-subtitle" x="384" y="394">prefill vs decode</text>
  <rect class="pill" x="384" y="424" width="184" height="38" rx="10" fill="#b9eee1"/>
  <text class="paper" x="404" y="449">Splitwise</text>
  <rect class="pill" x="384" y="478" width="184" height="38" rx="10" fill="#b9eee1"/>
  <text class="paper" x="404" y="503">DistServe</text>
  <rect class="pill" x="384" y="532" width="184" height="38" rx="10" fill="#b9eee1"/>
  <text class="paper" x="404" y="557">Mooncake</text>
  <rect class="pill" x="384" y="586" width="184" height="38" rx="10" fill="#b9eee1"/>
  <text class="paper" x="404" y="611">P/D-Serve</text>
  <text class="note" x="384" y="654">Best when phase resource</text>
  <text class="note" x="384" y="674">needs diverge strongly.</text>

  <rect class="card shadow" x="676" y="286" width="292" height="394" rx="18" stroke="#a6bdf5" fill="url(#afdGrad)"/>
  <text class="section-title" x="704" y="330">AFD / DEP</text>
  <text class="section-title" x="704" y="362">Operator Split</text>
  <text class="section-subtitle" x="704" y="394">attention vs FFN / experts</text>
  <rect class="pill" x="704" y="424" width="220" height="38" rx="10" fill="#c8d8ff"/>
  <text class="paper" x="724" y="449">MegaScale-Infer</text>
  <rect class="pill" x="704" y="478" width="220" height="38" rx="10" fill="#c8d8ff"/>
  <text class="paper" x="724" y="503">Step-3 / StepMesh</text>
  <rect class="pill" x="704" y="532" width="220" height="38" rx="10" fill="#c8d8ff"/>
  <text class="paper" x="724" y="557">JANUS / FinDEP</text>
  <rect class="pill" x="704" y="586" width="220" height="38" rx="10" fill="#c8d8ff"/>
  <text class="paper" x="724" y="611">AFD Theory</text>
  <text class="note" x="704" y="654">Powerful, but sensitive</text>
  <text class="note" x="704" y="674">to fabric and A/F ratio.</text>

  <rect class="card shadow" x="1020" y="286" width="244" height="394" rx="18" stroke="#f0c873" fill="url(#kvGrad)"/>
  <text class="section-title" x="1048" y="330">KV Cache</text>
  <text class="section-title" x="1048" y="362">Layer</text>
  <text class="section-subtitle" x="1048" y="394">state transfer and reuse</text>
  <rect class="pill" x="1048" y="424" width="168" height="38" rx="10" fill="#f9dc93"/>
  <text class="paper" x="1068" y="449">CacheGen</text>
  <rect class="pill" x="1048" y="478" width="168" height="38" rx="10" fill="#f9dc93"/>
  <text class="paper" x="1068" y="503">FlowKV</text>
  <rect class="pill" x="1048" y="532" width="168" height="38" rx="10" fill="#f9dc93"/>
  <text class="paper" x="1068" y="557">LMCache</text>
  <rect class="pill" x="1048" y="586" width="168" height="38" rx="10" fill="#f9dc93"/>
  <text class="paper" x="1068" y="611">Pensieve</text>
  <text class="note" x="1048" y="654">Turns attention state into</text>
  <text class="note" x="1048" y="674">a serving substrate.</text>

  <rect class="card shadow" x="1316" y="286" width="208" height="394" rx="18" stroke="#f3a2ad" fill="url(#aggGrad)"/>
  <text class="section-title" x="1344" y="330">Re-</text>
  <text class="section-title" x="1344" y="362">Aggregation</text>
  <text class="section-subtitle" x="1344" y="394">must-beat baselines</text>
  <rect class="pill" x="1344" y="424" width="132" height="38" rx="10" fill="#ffc3cc"/>
  <text class="paper" x="1364" y="449">SARATHI</text>
  <rect class="pill" x="1344" y="478" width="132" height="38" rx="10" fill="#ffc3cc"/>
  <text class="paper" x="1364" y="503">TaiChi</text>
  <rect class="pill" x="1344" y="532" width="132" height="38" rx="10" fill="#ffc3cc"/>
  <text class="paper" x="1364" y="557">MuxWise</text>
  <rect class="pill" x="1344" y="586" width="132" height="38" rx="10" fill="#ffc3cc"/>
  <text class="paper" x="1364" y="611">Nexus</text>
  <text class="note" x="1344" y="654">Shows physical split is</text>
  <text class="note" x="1344" y="674">not always necessary.</text>

  <path class="line" d="M306 484 C330 484 332 484 356 484"/>
  <path class="line" d="M624 484 C646 484 654 484 676 484"/>
  <path class="line" d="M968 484 C990 484 998 484 1020 484"/>
  <path class="dash" d="M1264 484 C1288 484 1292 484 1316 484"/>

  <rect class="card shadow" x="188" y="742" width="1224" height="152" rx="20" stroke="#cbd5e1" fill="#ffffff"/>
  <text class="section-title" x="226" y="788">Open Problems</text>
  <rect class="pill" x="226" y="822" width="212" height="40" rx="10" fill="#e0f2fe"/>
  <text class="small" x="246" y="847">Dynamic A/F ratios</text>
  <rect class="pill" x="468" y="822" width="250" height="40" rx="10" fill="#dcfce7"/>
  <text class="small" x="488" y="847">Communication dead zones</text>
  <rect class="pill" x="748" y="822" width="208" height="40" rx="10" fill="#fef3c7"/>
  <text class="small" x="768" y="847">KV pool isolation</text>
  <rect class="pill" x="986" y="822" width="184" height="40" rx="10" fill="#fae8ff"/>
  <text class="small" x="1006" y="847">Agentic workloads</text>
  <rect class="pill" x="1200" y="822" width="172" height="40" rx="10" fill="#ffe4e6"/>
  <text class="small" x="1220" y="847">Shared benchmark</text>

  <path class="dash" d="M490 680 C490 704 490 716 490 742"/>
  <path class="dash" d="M822 680 C822 704 822 716 822 742"/>
  <path class="dash" d="M1142 680 C1142 704 1142 716 1142 742"/>
  <path class="dash" d="M1420 680 C1420 704 1384 716 1356 742"/>

  <text class="subtitle" x="80" y="950">Use this map with papers.yaml, taxonomy.md, and reading-order.md in the repository.</text>
</svg>
